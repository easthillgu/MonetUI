<?xml version="1.0" encoding="UTF-8"?>
<!-- MonetUI —— 银行「栏位管理」钮图标，tools/svg/monet_tool_slots.svg
     画布 32×32（2 的幂），显示约 10×10 UI 单位 —— 先画大、再缩小，边缘才干净。

     图形语义：2×2 实心方格阵 = 「栏位 / 格子」。与背包窗口的方格语言同源，
     10px 下四块实心方 + 2 单位缝仍读得出是格子而不是噪点。

     纯白染色模具（无色相）：运行期 SetVertexColor 染 bright 档；
     透明像素 RGB 由 tools/svg-to-tga.js 补白衬底。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="4"  y="4"  width="11" height="11" fill="#ffffff"/>
  <rect x="17" y="4"  width="11" height="11" fill="#ffffff"/>
  <rect x="4"  y="17" width="11" height="11" fill="#ffffff"/>
  <rect x="17" y="17" width="11" height="11" fill="#ffffff"/>
</svg>
