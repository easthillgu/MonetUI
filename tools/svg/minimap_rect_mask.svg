<?xml version="1.0" encoding="UTF-8"?>
<!-- 小地图矩形遮罩：256×256 画布，190px 高的可见带，**上下透明带等宽**（各 33）。
      对称是刻意的：可见带的圆心 = 画布圆心，玩家箭头在正中。
      画布必须整块留在屏幕里（客户端给被屏幕切过的帧算遮罩时会按可见高度重算整张遮罩，1:1 映射
      就没了，地图下沿会比面板内沿高出一截、露出一条面板底色）。所以画布底贴屏幕底(0)，底部基线
      （Utils/Layout.lua 的 bottom）抬到 33 − PANEL_PAD(2) = 31。
      可见带四角半径 0：交付用**直角版**（square-blp 分支，圆角 r=8 实机视觉未通过），
      面板边框是方的，地图跟着方角才统一。曾试过 rx=6 的圆角版本（配合 r=8 面板），
      随该方案一起撤回，需要时把 rx 改回去并同步 Assets-src 的 TGA 即可。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="0" y="33" width="256" height="190" rx="0" ry="0" fill="#ffffff"/>
</svg>
