<?xml version="1.0" encoding="UTF-8"?>
<!-- 地图内的追踪按钮图标：**4:3 横长徽章**（准星）。
     画布 64×64（2 的幂），徽章本体 50×37.5 = 4:3，四周留白（x 7..57 / y 13..50.5）。
     2026-10-29 改细线 + 留白：徽章与符号描边 6 → 3.5（显示 20px 时 ≈1.1px，与关闭按钮同一口径），
     本体从 58×42 内缩到 50×37.5，不再贴边。
     白色描边 + 中性灰半透明底 + 白色符号 —— 整张图是"染色模具"（运行期 SetVertexColor
     染出主题色），所以底色必须是中性灰，不能带色相。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g>
    <rect x="7" y="13" width="50" height="37.5" rx="5" ry="5"
          fill="#2e2e2e" fill-opacity="0.55" stroke="#ffffff" stroke-width="3.5"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
      <circle cx="32" cy="31.75" r="8"/>
      <path d="M 32 17 V 20 M 32 43.5 V 46.5 M 18 31.75 H 21 M 43 31.75 H 46"/>
    </g>
  </g>
</svg>
