name: Release to CurseForge

# Tag with a plain version number (0.12.1) to match the 0.12.0 naming used by
# the first manual upload. A "v" prefix is accepted but shows up verbatim in the
# zip name and the CurseForge display name (the guard strips it for the TOC check).
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The TOC keeps a static Version (not @project-version@) so the local
      # WOWFOREVER install and the WhatsNew announcement stay meaningful.
      # Guard against forgetting to bump it when tagging a release.
      - name: Guard - TOC version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOC=$(sed -n 's/^## Version:[[:space:]]*//p' MonetUI.toc | head -1 | tr -d '\r')
          echo "tag=$TAG toc=$TOC"
          if [ "$TOC" != "$TAG" ]; then
            echo "::error::MonetUI.toc Version ($TOC) does not match tag ($TAG). Bump the TOC before tagging."
            exit 1
          fi

      # Dev surface stays in the repo and in the local WOWFOREVER install. Before packaging,
      # flip the TOC dev flag and drop the DEV-ONLY Script lines; .pkgmeta excludes the two
      # dev files themselves. packager copies from this working tree, so the edits land in the zip.
      - name: Strip dev-only surface for the release build
        run: |
          node tools/strip-dev.js --self-test
          node tools/strip-dev.js

      - name: Package, create GitHub Release, upload to CurseForge
        uses: BigWigsMods/packager@v2
        with:
          # -p  project id (also in the TOC as X-Curse-Project-ID)
          # -g  pin the Forever game version 1.60.1 -> gameVersionTypeID 88568
          # -n  "<zip name>:<CurseForge display name>"
          args: '-p 1791156 -g 1.60.1 -n "{package-name}-{project-version}-forever:{project-version}"'
        env:
          # Author Portal Upload API Token. Both secret names are accepted so an
          # already-created secret named CF_API_KEY keeps working.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
